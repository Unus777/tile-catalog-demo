<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#F1EADF">
<script>
(function(){var k='catalog-theme',t='light';try{var s=localStorage.getItem(k);if(s==='dark'||s==='light')t=s}catch(e){}document.documentElement.setAttribute('data-theme',t);document.documentElement.style.colorScheme=t;var m=document.querySelector('meta[name="theme-color"]');if(m)m.setAttribute('content',t==='dark'?'#0d0c0b':'#F1EADF');})();
</script>
<title>Плитка — Каталог плитки</title>
<meta name="description" content="Каталог керамогранита: форматы 60×60 и 60×120, интерьерные фото каждой модели.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 26 26'><path d='M13 1 25 13 13 25 1 13z' fill='%230d0c0b' stroke='%23c9a46a' stroke-width='1.6'/><path d='M13 7 19 13 13 19 7 13z' fill='%23e4c690'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=2611111807">
<script src="config.js?v=2611111807"></script>
<script src="brand.js?v=2611111807"></script>
<script src="admin.js?v=2611111807"></script>
</head>
<body data-page="tile">
<div class="progress" id="progress"></div>
<div class="proto-flag" title="Цены с пометкой «пример» — демонстрационные, пока их не заменят в редакторе."><i></i>Цены с пометкой «пример»</div>
<header class="nav solid" id="nav">
  <a class="logo" href="index.html" aria-label="Каталог плитки, на главную"><span class="logo-mark" aria-hidden="true"></span><span class="w">Каталог плитки<small>Каталог керамогранита</small></span></a>
  <nav class="nav-links" aria-label="Разделы">
    <a href="index.html#catalog">Каталог</a>
    <a href="index.html?f=60×60#catalog">60×60</a>
    <a href="index.html?f=60×120#catalog">60×120</a>
    <a href="index.html#room">Примерочная</a>
    <a data-cfg="dealers" hidden>Дилерам</a>
  </nav>
  <div class="nav-right">
    <div class="paytoggle" role="radiogroup" aria-label="Какие цены показывать">
      <span class="paytoggle-pill" aria-hidden="true"></span>
      <button type="button" role="radio" data-mode="cash" aria-checked="true">Наличные</button>
      <button type="button" role="radio" data-mode="noncash" aria-checked="false">Безнал<small> с НДС</small></button>
    </div>
    <a class="tel" data-cfg="phone" hidden></a>
    <a class="btn sm wa" data-cfg="whatsapp" hidden target="_blank" rel="noopener">WhatsApp</a>
    <a class="icon-btn call" data-cfg="phone-icon" hidden aria-label="Позвонить"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg></a>
    <button type="button" class="icon-btn theme-btn" id="themeBtn" aria-label="Включить тёмную тему" title="Тёмная тема">
      <svg class="i-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 3.2v2.2M12 18.6v2.2M4.7 4.7l1.6 1.6M17.7 17.7l1.6 1.6M3.2 12h2.2M18.6 12h2.2M4.7 19.3l1.6-1.6M17.7 6.3l1.6-1.6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      <svg class="i-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M15.2 4.2a7.8 7.8 0 1 0 4.6 11.6A8 8 0 0 1 15.2 4.2z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
    </button>
  </div>
</header>
<main class="pg" id="tile"></main>
<template id="roomTpl"><div class="room-wrap">
  <div class="room-stage" id="roomStage">
    <div class="room-gl" id="roomGl"></div>
    <div class="room-loading" id="roomLoading"><span></span>Готовим комнату…</div>
    <div class="room-views seg" id="roomModes" role="radiogroup" aria-label="Что облицовать"><button type="button" data-m="floor" class="on">Пол</button><button type="button" data-m="walls">Стены</button><button type="button" data-m="both">Пол и стены</button></div>
    <div class="room-tools">
      <button type="button" class="room-icon" id="roomReset" title="Сбросить вид" aria-label="Сбросить вид">↺</button>
      <button type="button" class="room-icon" id="roomShot" title="Скачать картинку" aria-label="Скачать картинку">↓</button>
    </div>
    <p class="room-hint" id="roomHint">Перетащите, чтобы осмотреть · колесо или жест — масштаб</p>
    <a class="room-label" id="roomLabel"></a>
  </div>
  <div class="room-side">
    <div class="room-ctrl">
      <div class="ctrl"><span>Комната</span><div class="seg" id="roomScenes" role="radiogroup" aria-label="Сцена"><button type="button" data-s="living" class="on">Гостиная</button><button type="button" data-s="bath">Ванная</button><button type="button" data-s="kitchen">Кухня</button></div></div>
      <div class="ctrl"><span>Раскладка</span><div class="seg wrap" id="patSeg" role="radiogroup" aria-label="Раскладка"><button type="button" data-p="straight" class="on">Прямая</button><button type="button" data-p="half">Со смещением</button><button type="button" data-p="third">⅓</button><button type="button" data-p="herringbone">Ёлочка</button><button type="button" data-p="diagonal">Диагональ</button></div></div>
      <div class="ctrl"><span>Цвет шва</span><div class="dots" id="groutDots"><button type="button" data-c="#f4efe6" title="Белый" style="--c:#f4efe6"></button><button type="button" data-c="#b9b2a7" title="Светло-серый" class="on" style="--c:#b9b2a7"></button><button type="button" data-c="#c9b79c" title="Бежевый" style="--c:#c9b79c"></button><button type="button" data-c="#8a8176" title="Какао" style="--c:#8a8176"></button><button type="button" data-c="#4a4642" title="Графит" style="--c:#4a4642"></button><button type="button" data-c="#1f1c19" title="Чёрный" style="--c:#1f1c19"></button></div></div>
      <div class="ctrl"><span>Ширина шва</span><div class="seg" id="groutW"><button type="button" data-w="1">1 мм</button><button type="button" data-w="2" class="on">2 мм</button><button type="button" data-w="3">3 мм</button><button type="button" data-w="4">4 мм</button></div></div>
    </div>
    <div class="closeup">
      <div class="loupe-box" id="loupeBox"><img id="loupeImg" alt="Плитка крупно" width="520" height="520"><div class="loupe" id="loupe"></div><span class="hint">Плитка · лупа</span></div>
      <div class="lay"><canvas id="layoutCv" width="640" height="640" aria-label="Схема раскладки"></canvas><span class="hint">Схема раскладки</span></div>
    </div>
    <div class="room-price" id="roomPrice"></div>
    
  </div>
</div>
</template>
<footer class="foot">
  <span data-brand="legal">Каталог плитки</span>
  <span data-cfg="footer-line" hidden></span>
  <a data-cfg="email" hidden></a>
  <span class="r"><span id="stat"></span><a href="index.html#catalog">Весь каталог</a><a class="admin-only" hidden href="prices.html">Цены</a><a class="admin-only" hidden href="edit.html">Редактор фото</a><a class="admin-login-link" href="admin.html">Вход для админов</a></span>
</footer>
<div class="callbar" hidden>
  <a class="btn gold" data-cfg="phone">Позвонить</a>
  <a class="btn" id="cbWa" data-cfg="whatsapp" target="_blank" rel="noopener">WhatsApp</a>
</div>
<div class="modal-back" id="priceModal" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="pmTitle">
    <h3 id="pmTitle">Изменить цену</h3>
    <p class="pm-art" id="pmSub"></p>
    <label class="field">Наличные, ₽/м²
      <input type="number" id="pmCash" min="0" step="10" inputmode="numeric">
    </label>
    <label class="remember"><input type="checkbox" id="pmAuto" checked> Безнал по правилу</label>
    <label class="field">Безнал с НДС, ₽/м²
      <input type="number" id="pmNon" min="0" step="10" inputmode="numeric" disabled>
    </label>
    <div class="pub-status" hidden></div>
    <div class="modal-acts">
      <button type="button" class="btn" id="pmCancel">Отмена</button>
      <button type="button" class="btn gold" id="pmSave">Сохранить на сайт</button>
    </div>
    <p class="ed-note">Защита — токен GitHub: без него сохранить на сайт нельзя.</p>
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="photos.js?v=2611111807"></script>
<script src="data.js?v=2611111807"></script>
<script src="app.js?v=2611111807"></script>
</body>
</html>
